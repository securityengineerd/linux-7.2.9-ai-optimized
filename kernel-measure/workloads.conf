# kernel-measure workload manifest
# Sourced by the harness. Keep this file to assignments and comments.
# Durations are seconds. Original workloads default to 15s or less; the
# task-targeted workloads (wake_llc, migrate_load) default to 30s or less.
#
# Concrete commands live in workloads/*.sh. This file is the knob list.
# Do not point any workload at a kernel tree, and do not rebuild a kernel.
#
# general
#   primary:  stress-ng --cpu $GENERAL_CPU_WORKERS --fork $GENERAL_FORK_WORKERS \
#               --timeout ${GENERAL_DURATION}s
#             --metrics-brief is added only when stress-ng --help lists it.
#             --fork is added only when that flag exists.
#   fallback: python3 CPU + fork/wait loop for $GENERAL_DURATION seconds
#             (used when stress-ng is not installed)
#   fallback: bash CPU + fork/wait loop if python3 is also absent
#
# containers
#   Runs only when docker or podman exists, info succeeds, and a local image
#   matches CONTAINER_IMAGE_CANDIDATES. This harness never pulls an image.
#   command:  $runtime run --rm --network none --entrypoint /bin/true $image
#             (retries --entrypoint true once if /bin/true is missing)
#   skip:     runtime missing, daemon unusable, or no matching local image
#
# database
#   DATABASE_ENGINE=auto:
#     1. sqlite3 write/read mix when sqlite3 is on PATH (no database server)
#     2. else sysbench threads stand-in when sysbench is on PATH
#        sysbench OLTP needs MySQL or Postgres. This harness will not set that up.
#     3. else skip
#   sqlite3:  CREATE, INSERT $SQLITE_ROWS rows, UPDATE, SELECT, DELETE
#             on a temp db with synchronous=FULL. The db is removed on exit.
#   sysbench: sysbench threads --threads $SYSBENCH_THREADS --thread-yields 200 \
#               --time $DATABASE_DURATION run
#
# storage
#   File is created under ${STORAGE_PARENT:-$TMPDIR} and removed on exit.
#   primary:  fio --name=kernel-measure --rw=randrw --rwmixread=50 --bs=4k \
#               --size ${STORAGE_MB}M --runtime $STORAGE_DURATION --time_based=1 \
#               --iodepth=1 --direct=1
#             If O_DIRECT fails (tmpfs often rejects it), retry with --direct=0
#             and record that in the run directory.
#   fallback: dd if=/dev/zero of=$file bs=1M count=$STORAGE_MB oflag=direct \
#               conv=fsync, then read it back with iflag=direct.
#             If oflag=direct fails, retry a buffered write and read.
#
# networking
#   Loopback only. No off-host traffic.
#   primary:  iperf3 -s -1 --bind 127.0.0.1, then
#             iperf3 -c 127.0.0.1 -t $NETWORK_DURATION
#   fallback: python3 TCP client/server on 127.0.0.1 for $NETWORK_DURATION seconds
#             if iperf3 is missing or its server will not stay up
#
# virtualization
#   Always skipped. If a qemu-system-* binary is on PATH, record its --version.
#   This harness never launches a VM, whatever VIRT_LAUNCH is set to.
#
# wake_llc  (Task 1: select_idle_sibling / select_idle_cpu idle search)
#   prepare:  builds build/wake_storm from workloads/src/wake_storm.c once,
#             outside perf stat, and reuses it on later boots (same binary).
#   primary:  build/wake_storm -d $WAKE_LLC_DURATION -m $WAKE_LLC_MESSENGERS \
#               -w $WAKE_LLC_WORKERS -s $WAKE_LLC_SPINNERS \
#               -p $WAKE_LLC_PERIOD_US -b $WAKE_LLC_BUSY_US
#             Each messenger futex-wakes its workers in a burst every period;
#             workers spin BUSY_US and sleep. WORKERS=0 means nproc per
#             messenger, so every burst spreads across the whole LLC.
#             First half: storm only. Second half: SPINNERS busy threads
#             (-1 = nproc/2) so the idle search must skip busy CPUs.
#             Reports wake-to-run latency p50/p90/p99/p99.9/max per phase.
#   fallback: stress-ng --switch $(nproc) --timeout ${WAKE_LLC_DURATION}s
#
# migrate_load  (Task 2: load balance vs cache placement)
#   prepare:  builds build/migrate_storm from workloads/src/migrate_storm.c.
#   primary:  build/migrate_storm -d $MIGRATE_DURATION -w $MIGRATE_WORKERS \
#               -k $MIGRATE_BUF_KB -t $MIGRATE_STORM_MS
#             WORKERS=0 means nproc*1.5 pointer-chase workers, each with a
#             private BUF_KB working set. Phases: free / storm (pin to a
#             rotating CPU, then unpin, every STORM_MS) / settle.
#   fallback: stress-ng --affinity $(nproc) --affinity-rand --cache $(nproc)/2
#   On one NUMA node and one L3 the NUMA half of Task 2 cannot be shown;
#   topology_note.txt in the run says so.

# cgroup_cpu  (Task 3: hierarchical cpu.weight / cpu.max enqueue cost)
#   Creates /sys/fs/cgroup/kmeas.slice/... trees at each depth in CGCPU_DEPTHS
#   (default "1 3 6"). At every depth, sibling leaves get CGCPU_WEIGHTS
#   (default "100 200 400") and oversubscribed CPU hogs (stress-ng --cpu, or
#   bash busy loops). A separate "throttle" sibling gets cpu.max=CGCPU_MAX
#   (default "20000 100000") so throttle counters move without skewing weights.
#   Reports wl_weight_err_pct / wl_weight_err_pct_dN (share vs weight MAPE),
#   wl_nr_throttled, wl_throttled_usec into workload.metrics.
#   skip: cgroup v2 or cpu controller missing, or no passwordless sudo.
#   Cleanup is trap-guaranteed; the tree is removed after each run.

# io_uring_submit  (Task 9: lockless single-issuer submission)
#   prepare:  builds build/io_uring_submit from workloads/src/io_uring_submit.c
#   primary:  build/io_uring_submit -d $IOURING_DURATION -b $IOURING_BATCH \
#               -e $IOURING_ENTRIES
#             Ring: IORING_SETUP_SINGLE_ISSUER|DEFER_TASKRUN|COOP_TASKRUN.
#             Floods IORING_OP_NOP; drains CQ each enter. Reports wl_nops_per_sec,
#             wl_submitted, wl_completed, wl_enters into workload.metrics.
#   fallback: fio --ioengine=io_uring (no SINGLE_ISSUER; regression only)

GENERAL_DURATION=10
CONTAINER_DURATION=10
DATABASE_DURATION=10
STORAGE_DURATION=8
NETWORK_DURATION=8

GENERAL_CPU_WORKERS=2
GENERAL_FORK_WORKERS=2

CONTAINER_MAX_RUNS=3
CONTAINER_IMAGE_CANDIDATES="alpine:latest busybox:latest alpine:3 busybox:1"

# auto | sqlite3 | sysbench
DATABASE_ENGINE=auto
SQLITE_ROWS=2000
SYSBENCH_THREADS=2

STORAGE_MB=32
# Empty means ${TMPDIR:-/tmp}.
STORAGE_PARENT=

NETWORK_MIB=32

# Documented policy. The virtualization workload will not boot a guest.
VIRT_LAUNCH=never

WAKE_LLC_DURATION=20
# auto | c | stress-ng
WAKE_LLC_ENGINE=auto
WAKE_LLC_MESSENGERS=2
WAKE_LLC_WORKERS=0
WAKE_LLC_SPINNERS=-1
WAKE_LLC_PERIOD_US=1000
WAKE_LLC_BUSY_US=20

MIGRATE_DURATION=18
# auto | c | stress-ng
MIGRATE_ENGINE=auto
MIGRATE_WORKERS=0
MIGRATE_BUF_KB=256
MIGRATE_STORM_MS=10

CGCPU_DURATION=24
CGCPU_ROOT=/sys/fs/cgroup/kmeas.slice
CGCPU_DEPTHS="1 3 6"
CGCPU_WEIGHTS="100 200 400"
# quota period for the heaviest sibling leaf (cpu.max)
CGCPU_MAX="20000 100000"
# 0 = auto (oversubscribe: ~2*nproc / num_weights per sibling)
CGCPU_HOGS_PER_SIB=0
CGCPU_SETTLE_MS=200

# 1 = enable kernel.sched_schedstats during collect and restore it after
# (needs root or passwordless sudo). Same as collect.sh --schedstats.
# Off by default so no collector requires root.
SCHEDSTATS_ENABLE=0

# collect.sh kills a workload that outlives its duration plus this many seconds.
OUTER_TIMEOUT_GRACE=15

# Cap on the copied sched trace, in bytes.
TRACE_COPY_MAX_BYTES=33554432

IOURING_DURATION=12
IOURING_ENGINE=auto
IOURING_BATCH=32
IOURING_ENTRIES=256
IOURING_MB=32

# tcp_recv_zc  (Task 4: TCP recv zero-copy path)
#   prepare:  builds build/tcp_recv_zc from workloads/src/tcp_recv_zc.c
#   primary:  build/tcp_recv_zc -d $TCPRECV_DURATION -c $TCPRECV_CHUNK_KB -i $TCPRECV_IFACE
#             Classic recv() on 127.0.0.1; probes MSG_SOCK_DEVMEM and
#             io_uring zcrx IFQ register. Reports wl_bytes_per_sec,
#             wl_zc_available (0 when NIC lacks HDS/memory-provider).
#   fallback: iperf3 localhost (no ZC probe; regression only)

TCPRECV_DURATION=10
TCPRECV_ENGINE=auto
TCPRECV_CHUNK_KB=64
TCPRECV_IFACE=enp3s0f0

# hot_read  (Task 5: buffered-read copy avoidance on hot page-cache reads)
#   prepare:  builds build/hot_read from workloads/src/hot_read.c
#   primary:  build/hot_read -d $HOTREAD_DURATION -s $HOTREAD_FILE_MB \
#               -b $HOTREAD_CHUNK_KB [-t $HOTREAD_TARGET_MIB] -p $parent
#             Warms file into page cache, then same byte budget via buffered
#             pread, mmap, and O_DIRECT. Reports wl_*_bytes_per_sec and
#             wl_*_vs_buffered_ns_ratio. Parent must not be tmpfs.
#   fallback: fio buffered+direct randread (no mmap; regression only)

HOTREAD_DURATION=12
HOTREAD_ENGINE=auto
HOTREAD_FILE_MB=64
HOTREAD_CHUNK_KB=128
# 0 = auto-size from duration
HOTREAD_TARGET_MIB=0
# Empty = pick first writable non-tmpfs among harness/runs, $HOME, /var/tmp
HOTREAD_PARENT=

# anon_fault  (Task 6: amortize anonymous write-fault zeroing via PMD/mTHP)
#   prepare:  builds build/anon_fault from workloads/src/anon_fault.c
#   primary:  build/anon_fault -s $ANONFAULT_SIZE_MIB -p $ANONFAULT_STRIDE -r $ANONFAULT_RETOUCH
#             mmap SIZE MiB anon; write-touch every page under MADV_NOHUGEPAGE
#             then MADV_HUGEPAGE. Reports wl_*_fault_ns, wl_*_minflt,
#             wl_hugeprefer_vs_nohuge_fault_ns_ratio. Relies on current
#             /sys/kernel/mm/transparent_hugepage policy (stock: madvise, 2M inherit).
#   optional: ANONFAULT_ENABLE_MTHP=1 enables 64k..1024k mTHP always for the run
#             (restored after); needs passwordless sudo.
#   fallback: python3 mmap touch (no C compiler)

ANONFAULT_DURATION=8
ANONFAULT_ENGINE=auto
ANONFAULT_SIZE_MIB=1024
ANONFAULT_STRIDE=4096
ANONFAULT_RETOUCH=1
ANONFAULT_ENABLE_MTHP=0

# mem_pressure  (Task 7: reclaim/compaction off allocating path under pressure)
#   prepare:  builds build/mem_pressure from workloads/src/mem_pressure.c
#   primary:  build/mem_pressure -r $MEMPRESS_RESERVE_MIB -f $MEMPRESS_FILL_PCT \
#               -c $MEMPRESS_CHUNK_MIB -n $MEMPRESS_ROUNDS
#             Fill most of MemAvailable-reserve with anon, punch alternate
#             pages to fragment buddy, then THP-preferring alloc rounds.
#             Reports wl_alloc_fault_ns, wl_compact_stall_delta,
#             wl_pgscan_direct_delta, wl_oom_kill_delta, wl_thp_*.
#   policy:   MEMPRESS_THP_DEFRAG=always|defer|defer+madvise|madvise|never
#             temporarily sets /sys/kernel/mm/transparent_hugepage/defrag
#             (restored after). MEMPRESS_COMPACTION_PROACTIVENESS sets
#             vm.compaction_proactiveness. Needs passwordless sudo.
#   fallback: python3 fill/punch/alloc (regression only)

MEMPRESS_DURATION=20
MEMPRESS_ENGINE=auto
MEMPRESS_RESERVE_MIB=1024
MEMPRESS_FILL_PCT=95
MEMPRESS_CHUNK_MIB=64
MEMPRESS_ROUNDS=32
MEMPRESS_THP_DEFRAG=
MEMPRESS_COMPACTION_PROACTIVENESS=
MEMPRESS_MODE=fragment

# folio_split  (Task 8: stop reclaim from splitting large anon folios)
#   prepare:  builds build/folio_split from workloads/src/folio_split.c
#   primary:  build/folio_split -m $FOLIOSPLIT_MODE -r $FOLIOSPLIT_RESERVE_MIB \
#               -t $FOLIOSPLIT_THP_MIB [-h $FOLIOSPLIT_HOG_MIB] -p $FOLIOSPLIT_PUNCH_EVERY_N
#             Create many PMD anon THPs, optionally partially unmap / underuse /
#             fragment swap, then memory-hog reclaim so split counters move.
#             Reports wl_thp_split_page_delta, wl_thp_deferred_split_page_delta,
#             wl_thp_swpout(_fallback)_delta, wl_pgscan_*, wl_oom_kill_delta.
#   policy:   FOLIOSPLIT_SHRINK_UNDERUSED=0|1 temporarily sets
#             /sys/kernel/mm/transparent_hugepage/shrink_underused (restored).
#   modes:    partial (default), swapfb, underused

FOLIOSPLIT_DURATION=25
FOLIOSPLIT_ENGINE=auto
FOLIOSPLIT_MODE=${FOLIOSPLIT_MODE:-partial}
FOLIOSPLIT_RESERVE_MIB=1024
FOLIOSPLIT_THP_MIB=${FOLIOSPLIT_THP_MIB:-2048}
FOLIOSPLIT_HOG_MIB=0
FOLIOSPLIT_PUNCH_EVERY_N=2
FOLIOSPLIT_SHRINK_UNDERUSED=${FOLIOSPLIT_SHRINK_UNDERUSED:-}

# util_est_burst  (Task 11: util_est for placement — bursty on/off CPU)
#   prepare:  builds build/util_est_burst from workloads/src/util_est_burst.c
#   primary:  build/util_est_burst -d $UTIL_EST_DURATION -b $UTIL_EST_NBURST \
#               -h $UTIL_EST_NHOG -o $UTIL_EST_ON_US -f $UTIL_EST_OFF_US
#             Burst workers: busy ON_US then sleep OFF_US. Hogs always-on.
#             OFF should be long enough for PELT util_avg to decay while
#             util_est EWMA still holds. Reports wl_bursts_per_sec,
#             wl_wake_lat_*, wl_burst_migrate_frac, wl_sched_feat_util_est.
#   fallback: stress-ng --cpu (regression only)

UTIL_EST_DURATION=15
UTIL_EST_ENGINE=auto
# 0 = nproc burst workers
UTIL_EST_NBURST=0
# -1 = nproc/3 always-on hogs
UTIL_EST_NHOG=-1
UTIL_EST_ON_US=5000
UTIL_EST_OFF_US=80000

# softirq_storm  (Task 12: softirq/RCU off irq-exit)
#   prepare:  builds build/softirq_storm from workloads/src/softirq_storm.c
#   primary:  build/softirq_storm -d $SOFTIRQ_DURATION -t $SOFTIRQ_NTIMER \
#               -n $SOFTIRQ_NNET -r $SOFTIRQ_NRCU
#             Phases: timerfd storm (TIMER), UDP loopback flood (NET_*),
#             mixed + mmap/munmap (RCU callbacks). Latency sampler throughout.
#             Wrapper records /proc/softirqs deltas, ksoftirqd ms, rcu stall
#             dmesg delta, and boot knobs (threadirqs, rcu_nocbs, use_softirq).
#   fallback: stress-ng --timer + --udp (no wake-lat wl_*)

SOFTIRQ_DURATION=15
SOFTIRQ_ENGINE=auto
SOFTIRQ_NTIMER=4
SOFTIRQ_NNET=4
SOFTIRQ_NRCU=2

# folio_wait  (Task 15: hashed folio wait table collision / herd)
#   prepare:  builds build/folio_wait from workloads/src/folio_wait.c
#   primary:  build/folio_wait -d $FOLIOWAIT_DURATION -t $FOLIOWAIT_THREADS \
#               -f $FOLIOWAIT_NFILES -s $FOLIOWAIT_FILE_KB -c $FOLIOWAIT_CHUNK_KB \
#               -m $FOLIOWAIT_MODE -p $workdir
#             Many files × threads doing write+fdatasync (or sync_file_range /
#             mixed readers) so unrelated folios wait on PG_writeback/PG_locked
#             through the 256-bucket folio_wait_table.
#             Reports wl_folio_wait_ops_per_sec, wl_folio_wait_lat_p{50,90,99}_ns,
#             vmstat dirty/writeback deltas.
#   fallback: fio randwrite+fsync (no precise wait-lat wl_*)

FOLIOWAIT_DURATION=${FOLIOWAIT_DURATION:-15}
FOLIOWAIT_ENGINE=auto
FOLIOWAIT_MODE=${FOLIOWAIT_MODE:-writeback}
# 0 = nproc
FOLIOWAIT_THREADS=${FOLIOWAIT_THREADS:-0}
FOLIOWAIT_NFILES=${FOLIOWAIT_NFILES:-512}
FOLIOWAIT_FILE_KB=${FOLIOWAIT_FILE_KB:-64}
FOLIOWAIT_CHUNK_KB=${FOLIOWAIT_CHUNK_KB:-4}
# Empty = first writable non-tmpfs among harness/runs, $HOME, /var/tmp
FOLIOWAIT_PARENT=

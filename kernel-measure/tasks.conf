# Task map for kernel-measure.
# One line per roadmap task id. Fields are pipe-separated:
#   id|name|measures|workloads|primary_metrics|pass_fail
# workloads and primary_metrics are space-separated.
# LLC-load-misses is unavailable on the test CPU; use cache-misses instead.
# Pass/fail notes are qualitative gates for humans, not automatic thresholds.
# compare.sh --task N prints the primary metrics in this order, then every
# workload-reported wl_* metric. Metric keys are the metrics.env keys:
#   wall_time_sec cycles instructions ipc cache_misses cache_misses_per_kinstr
#   tlb_misses context_switches cpu_migrations rq_latency_ns run_delay_ns_delta
#   pcount_delta sched_count_delta sched_goidle_delta ttwu_count_delta
#   ttwu_local_delta ttwu_remote_delta pgscan_delta pgsteal_delta
#   compact_stall_delta thp_fault_fallback_delta numa_hint_faults_delta wl_*
# ttwu_* and sched_count/sched_goidle need collect.sh --schedstats (n/a otherwise).
# Task 3 has cgroup_cpu; Task 9 has io_uring_submit (single-issuer NOP hammer).
# Task 6 has anon_fault (4k vs PMD/mTHP write-touch). Task 7 has mem_pressure
# (fragment+THP alloc under pressure). Task 8 has folio_split (THP reclaim/deferred-split pressure). Task 11 has util_est_burst (on/off CPU). Tasks 12-16 still reuse originals.
# Task 4 has tcp_recv_zc; Task 5 has hot_read (buffered vs mmap vs O_DIRECT).
# Task 12 has softirq_storm (TIMER/NET/RCU softirq + wake-lat).

